name: gigjar

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gigjar
      POSTGRES_PASSWORD: gigjar
      POSTGRES_DB: gigjar
    ports:
      - "${GIGJAR_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gigjar -d gigjar"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE: migrate
    command: ["up"]
    environment:
      GIGJAR_ENV: development
      GIGJAR_DATABASE_URL: postgres://gigjar:gigjar@postgres:5432/gigjar?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE: api
    environment:
      GIGJAR_ENV: development
      GIGJAR_DATABASE_URL: postgres://gigjar:gigjar@postgres:5432/gigjar?sslmode=disable
      GIGJAR_HTTP_ADDR: ":8080"
      GIGJAR_CORS_ALLOWED_ORIGINS: http://localhost:3000
      GIGJAR_CHAIN_NETWORK: ${GIGJAR_CHAIN_NETWORK:-simulated}
      GIGJAR_SETTLEMENT_THRESHOLD: ${GIGJAR_SETTLEMENT_THRESHOLD:-12}
      GIGJAR_SETTLEMENT_FEE: ${GIGJAR_SETTLEMENT_FEE:-1}
    ports:
      - "${GIGJAR_API_PORT:-8090}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  watcher:
    build:
      context: .
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE: watcher
    environment:
      GIGJAR_ENV: development
      GIGJAR_DATABASE_URL: postgres://gigjar:gigjar@postgres:5432/gigjar?sslmode=disable
      GIGJAR_CHAIN_NETWORK: ${GIGJAR_CHAIN_NETWORK:-simulated}
      GIGJAR_TRONGRID_API_KEY: ${GIGJAR_TRONGRID_API_KEY:-}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  sweeper:
    build:
      context: .
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE: sweeper
    environment:
      GIGJAR_ENV: development
      GIGJAR_DATABASE_URL: postgres://gigjar:gigjar@postgres:5432/gigjar?sslmode=disable
      GIGJAR_CHAIN_NETWORK: ${GIGJAR_CHAIN_NETWORK:-simulated}
      GIGJAR_SETTLEMENT_THRESHOLD: ${GIGJAR_SETTLEMENT_THRESHOLD:-12}
      GIGJAR_SETTLEMENT_FEE: ${GIGJAR_SETTLEMENT_FEE:-1}
      GIGJAR_TRONGRID_API_KEY: ${GIGJAR_TRONGRID_API_KEY:-}
      GIGJAR_SIGNER_URL: http://signer:8081
      GIGJAR_SIGNER_TOKEN: ${GIGJAR_SIGNER_TOKEN:-}
      GIGJAR_ENERGY_PROVIDER: ${GIGJAR_ENERGY_PROVIDER:-tronsave}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  signer:
    profiles: ["real-chain"]
    build:
      context: .
      dockerfile: infra/docker/signer.Dockerfile
    environment:
      GIGJAR_CHAIN_NETWORK: ${GIGJAR_CHAIN_NETWORK:-tron-nile}
      GIGJAR_SIGNER_SEED: ${GIGJAR_SIGNER_SEED:-}
      GIGJAR_SIGNER_TOKEN: ${GIGJAR_SIGNER_TOKEN:-}
      GIGJAR_TRONGRID_API_KEY: ${GIGJAR_TRONGRID_API_KEY:-}
    expose:
      - "8081"
    restart: unless-stopped

volumes:
  postgres-data:
