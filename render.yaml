envVarGroups:
  - name: gigjar-common
    envVars:
      - key: GIGJAR_ENV
        value: production
      - key: GIGJAR_CHAIN_NETWORK
        value: tron-nile
      - key: GIGJAR_LOG_FORMAT
        value: json
      - key: GIGJAR_SETTLEMENT_THRESHOLD
        value: "12"
      - key: GIGJAR_SETTLEMENT_FEE
        value: "1"

databases:
  - name: gigjar-db
    plan: free
    region: frankfurt
    databaseName: gigjar
    user: gigjar
    postgresMajorVersion: "16"

services:
  - type: pserv
    name: gigjar-signer
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: services/signer
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod
    startCommand: node src/server.js
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - services/signer/**
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GIGJAR_CHAIN_NETWORK
        value: tron-nile
      - key: GIGJAR_SIGNER_PORT
        value: "8081"
      - key: GIGJAR_SIGNER_TOKEN
        generateValue: true
      - key: GIGJAR_SIGNER_SEED
        sync: false
      - key: GIGJAR_TRONGRID_API_KEY
        sync: false

  - type: worker
    name: gigjar-watcher
    runtime: go
    plan: starter
    region: frankfurt
    buildCommand: go build -trimpath -o bin/watcher ./services/watcher && go build -trimpath -o bin/migrate ./services/migrate
    preDeployCommand: ./bin/migrate up
    startCommand: ./bin/watcher run
    autoDeployTrigger: commit
    buildFilter:
      ignoredPaths:
        - apps/**
        - services/signer/**
        - docs/**
    envVars:
      - fromGroup: gigjar-common
      - key: GIGJAR_DATABASE_URL
        fromDatabase:
          name: gigjar-db
          property: connectionString
      - key: GIGJAR_TRONGRID_API_KEY
        sync: false

  - type: worker
    name: gigjar-sweeper
    runtime: go
    plan: starter
    region: frankfurt
    buildCommand: go build -trimpath -o bin/sweeper ./services/sweeper
    startCommand: ./bin/sweeper
    autoDeployTrigger: commit
    buildFilter:
      ignoredPaths:
        - apps/**
        - services/signer/**
        - docs/**
    envVars:
      - fromGroup: gigjar-common
      - key: GIGJAR_DATABASE_URL
        fromDatabase:
          name: gigjar-db
          property: connectionString
      - key: GIGJAR_TRONGRID_API_KEY
        sync: false
      - key: GIGJAR_SIGNER_URL
        fromService:
          type: pserv
          name: gigjar-signer
          property: hostport
      - key: GIGJAR_SIGNER_TOKEN
        fromService:
          type: pserv
          name: gigjar-signer
          envVarKey: GIGJAR_SIGNER_TOKEN

  - type: web
    name: gigjar-api
    runtime: go
    plan: free
    region: frankfurt
    buildCommand: go build -trimpath -o bin/api ./services/api
    startCommand: ./bin/api
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    buildFilter:
      ignoredPaths:
        - apps/**
        - services/signer/**
        - docs/**
    envVars:
      - fromGroup: gigjar-common
      - key: GIGJAR_DATABASE_URL
        fromDatabase:
          name: gigjar-db
          property: connectionString
      - key: GIGJAR_HTTP_ADDR
        value: ":10000"
      - key: GIGJAR_PUBLIC_WEB_URL
        value: https://gigjar-web.onrender.com
      - key: GIGJAR_CORS_ALLOWED_ORIGINS
        value: https://gigjar-web.onrender.com

  - type: web
    name: gigjar-web
    runtime: node
    plan: free
    region: frankfurt
    rootDir: apps/web
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/web/**
        - packages/contracts/**
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GIGJAR_API_ORIGIN
        value: https://gigjar-api.onrender.com
