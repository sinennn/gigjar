envVarGroups:
  - name: gigjar-common
    envVars:
      - key: GIGJAR_ENV
        value: production
      - key: GIGJAR_CHAIN_NETWORK
        value: tron-nile
      - key: GIGJAR_LOG_FORMAT
        value: json
      - key: GIGJAR_SETTLEMENT_THRESHOLD
        value: "12"
      - key: GIGJAR_SETTLEMENT_FEE
        value: "1"

services:
  - type: web
    name: gigjar-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./infra/docker/render.Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    buildFilter:
      ignoredPaths:
        - apps/**
        - docs/**
    envVars:
      - fromGroup: gigjar-common
      - key: GIGJAR_DATABASE_URL
        sync: false
      - key: GIGJAR_HTTP_ADDR
        value: ":10000"
      - key: GIGJAR_PUBLIC_WEB_URL
        sync: false
      - key: GIGJAR_CORS_ALLOWED_ORIGINS
        sync: false
      - key: GIGJAR_SIGNER_TOKEN
        generateValue: true
      - key: GIGJAR_SIGNER_SEED
        sync: false
      - key: GIGJAR_TRONGRID_API_KEY
        sync: false
